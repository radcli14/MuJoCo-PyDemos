title: MuJoCo PyDemos
description: >-
  Open-source Python simulations of the MuJoCo physics engine — rigid-body
  dynamics, contacts, and constrained motion, with rendered video and state
  plots for each demo.
url: "https://mujoco.dc-engineer.com"
baseurl: ""

author:
  name: DC Engineer

image: /images/dc-engineer-logo-transparent.png

# Used in layouts to build GitHub source-file links
github_repo:   "https://github.com/radcli14/MuJoCo-PyDemos"
github_branch: "main"

# GitHub Pages supported plugins
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# Social links (used by jekyll-seo-tag for JSON-LD)
social:
  name: DC Engineer
  links:
    - https://dc-engineer.com
    - https://github.com/radcli14
    - https://www.instagram.com/ar.mobile.robotics
    - https://armor.dc-engineer.com
    - https://twolinks.dc-engineer.com
    - https://youkon.dc-engineer.com
    - https://www.youtube.com/@dc-engineer

# Tell Kramdown to emit \[...\] / \(...\) so MathJax 3 can find the math
markdown: kramdown
kramdown:
  math_engine: mathjax

# Exclude from Jekyll build
exclude:
  - .venv/
  - "**/*.py"
  - "**/*.mp4"
  - requirements.txt
  - Gemfile
  - Gemfile.lock
  - CLAUDE.md        # Claude Code context file — not a site page
  - common.py        # already covered by **/*.py but listed explicitly
