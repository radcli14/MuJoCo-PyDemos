<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="#1A2035"/>

  <!-- M — bold geometric sans, lower half; V outer tip at (256,412) -->
  <polygon
    points="40,492 40,300 112,300 256,412 400,300 472,300
            472,492 400,492 400,368 256,468 112,368 112,492"
    fill="#C0CCDC"/>

  <!-- Shield border -->
  <path d="M 140,52 L 372,52 L 372,280 L 256,404 L 140,280 Z"
        fill="#7A5A10"/>

  <!-- Shield face -->
  <path d="M 154,66 L 358,66 L 358,274 L 256,390 L 154,274 Z"
        fill="#C89A28"/>

  <!-- Snake body — S-curve -->
  <path d="M 226,108 C 192,134 188,172 224,198
           C 262,224 318,234 312,286
           C 306,332 270,360 256,378"
        stroke="#3A7020" stroke-width="22" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Snake head -->
  <circle cx="226" cy="92" r="15" fill="#3A7020"/>

  <!-- Snake eye -->
  <circle cx="220" cy="86" r="4" fill="#E8C030"/>

  <!-- Snake forked tongue -->
  <path d="M 215,80 L 205,67 M 215,80 L 212,68"
        stroke="#CC2222" stroke-width="3.5"
        stroke-linecap="round" fill="none"/>

</svg>
